name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install the fonts used by the figures
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-liberation fonts-inter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests -v
      - run: python run.py verify --output outputs/verify
      - run: python run.py figures --output outputs/figures
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outputs
          path: outputs/
          retention-days: 30
